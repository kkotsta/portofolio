<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Life Dashboard — Five Themes</title>
<meta name="theme-color" content="#e9e3d2">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap">
<style>
/* Layout: dense console. Ink sidebar, outlined cards with a small hard shadow, mono labels, flat colour used only to mark module and status */
:root{
  --bg:#e9e3d2; --frame:#f9f6ef; --card:#fffdf7; --card-solid:#fffdf7; --line:rgba(40,40,40,.16);
  --fg:#282828; --mut:#6b665a; --accent:#193497; --accent-soft:rgba(25,52,151,.10); --coral:#EDA398;
  --side:#282828; --on-side:#f4efe2; --frameline:#282828; --shadow:#282828;
  --y:#f4c542; --pk:#EDA398; --gn:#a8b86b; --bl:#b7c6ee;
  --good:#2f7d4f; --warn:#a85f00; --crit:#c62a3a;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-head:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0d0d; --frame:#171716; --card:#1f1f1d; --card-solid:#292926; --line:rgba(244,239,226,.15);
  --fg:#f4efe2; --mut:#aaa595; --accent:#8da2ee; --accent-soft:rgba(141,162,238,.16); --coral:#EDA398;
  --side:#0a0a0a; --on-side:#f4efe2; --frameline:#3d3d38; --shadow:#000;
  --y:#dcae35; --pk:#dc968a; --gn:#93a35a; --bl:#93a6dc;
  --good:#5fcf8f; --warn:#f0b250; --crit:#ff7a86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --frame:#171716; --card:#1f1f1d; --card-solid:#292926; --line:rgba(244,239,226,.15);
  --fg:#f4efe2; --mut:#aaa595; --accent:#8da2ee; --accent-soft:rgba(141,162,238,.16); --coral:#EDA398;
  --side:#0a0a0a; --on-side:#f4efe2; --frameline:#3d3d38; --shadow:#000;
  --y:#dcae35; --pk:#dc968a; --gn:#93a35a; --bl:#93a6dc;
  --good:#5fcf8f; --warn:#f0b250; --crit:#ff7a86; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:13.5px/1.45 var(--f-body);margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:600}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:8px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;max-width:1400px;margin:16px auto;padding:12px;background:var(--frame);border:2px solid var(--frameline);border-radius:16px}
.side{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;gap:2px;background:var(--side);color:var(--on-side);border-radius:12px;padding:12px 10px}
.brand{font:600 17px var(--f-head);padding:4px 8px 12px;letter-spacing:-.02em}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;color:color-mix(in srgb,var(--on-side) 66%,transparent);font-weight:500;font-size:13.5px}
.nav:hover{color:var(--on-side);background:rgba(255,255,255,.08)}
.nav[aria-current=page]{background:var(--pk);color:#282828}
.nav svg{width:17px;height:17px;flex:none}
.main{min-width:0;display:flex;flex-direction:column;gap:12px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;gap:10px;background:var(--side);color:var(--on-side);border-radius:10px;padding:8px 14px;font-size:13px}
.strip .mut{color:color-mix(in srgb,var(--on-side) 62%,transparent)}
.strip .strip-center{text-align:center}
.strip .strip-end{text-align:right}
.strip .pill,.strip .pill.crit,.strip .pill.warn,.strip .pill.good{background:var(--pk);color:#282828}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:1px 7px;font:600 11px var(--f-head);background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.crit{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.dk{background:#282828;color:#f4efe2}
.grid{display:grid;gap:12px;grid-template-columns:repeat(12,minmax(0,1fr))}
.card{background:var(--card);border:2px solid var(--frameline);box-shadow:3px 3px 0 var(--shadow);border-radius:10px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}
.card.y,.card.pk,.card.gn,.card.bl{--fg:#1f1f1f;--mut:rgba(31,31,31,.7);--card-solid:#fffdf7;--line:rgba(31,31,31,.2);--accent:#193497;--accent-soft:rgba(25,52,151,.14);--good:#1f6a3f;--warn:#8a4b00;--crit:#a8202f;color:#1f1f1f}
.card.y{background:var(--y)}.card.pk{background:var(--pk)}.card.gn{background:var(--gn)}.card.bl{background:var(--bl)}
.card.y .item,.card.pk .item,.card.gn .item,.card.bl .item{background:rgba(255,253,247,.6)}
.tag{width:9px;height:9px;border-radius:2px;flex:none}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.row{display:flex;align-items:center;gap:8px;min-width:0}.row.wrap{flex-wrap:wrap}.sp{flex:1}
.mut{color:var(--mut);font-size:12px}
.mono{font-family:var(--f-head);font-size:12px}
.item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;background:color-mix(in srgb,var(--fg) 5%,transparent);min-width:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.deadline-item{display:grid;grid-template-columns:9px minmax(0,1fr);align-items:start}
.deadline-item>.dot{margin-top:5px}
.deadline-item .t{overflow-wrap:normal}
.deadline-controls{grid-column:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.deadline-controls select{flex:0 1 126px}
.item.past{opacity:.5}
.dot{width:9px;height:9px;border-radius:2px;flex:none}
.btn{border:2px solid var(--frameline);background:var(--card-solid);border-radius:8px;padding:5px 12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.cor{background:var(--pk);color:#1f1f1f}
.btn.dk{background:#282828;border-color:#282828;color:#f4efe2}
.btn.sm{padding:2px 8px;font-size:12px;border-width:1.5px}
.btn.ico{padding:6px;line-height:0}
.strip .btn{background:var(--frame);border-color:var(--frame);color:var(--fg)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--card-solid);color:var(--fg);border:1.5px solid var(--frameline);border-radius:8px;padding:5px 9px;min-width:0}
input[type=range]{accent-color:var(--accent)}
textarea{width:100%;resize:vertical}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tab{border:1.5px solid var(--frameline);background:none;border-radius:7px;padding:3px 11px;color:var(--mut);font-weight:600}
.tab[aria-pressed=true]{background:#282828;color:#f4efe2}
.bar{height:6px;border-radius:2px;background:rgba(127,127,127,.25);overflow:hidden}.bar>b{display:block;height:100%;background:var(--accent)}
.hello{font:600 24px/1.1 var(--f-head);letter-spacing:-.03em}
.big{font:600 40px/1 var(--f-head);letter-spacing:-.03em}
.chk{width:18px;height:18px;border-radius:4px;border:2px solid currentColor;background:none;flex:none;display:grid;place-items:center;padding:0;color:inherit;opacity:.8}
.chk[aria-checked=true]{background:#282828;border-color:#282828;color:#f4efe2;opacity:1}
.done{text-decoration:line-through;opacity:.5}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cell{min-height:92px;background:color-mix(in srgb,var(--fg) 4%,transparent);border:1.5px solid var(--line);border-radius:8px;padding:6px;font-size:11px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cell.today{background:var(--pk);color:#1f1f1f;border-color:#282828}
.ev{border-radius:4px;padding:1px 5px;color:#fff;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.dl{background:none!important;border:1.5px dashed currentColor}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.evc{border-radius:10px;overflow:hidden;background:var(--card-solid);border:2px solid var(--frameline);display:flex;flex-direction:column}
.evc .img{height:80px;display:flex;align-items:flex-end;padding:10px;color:#1f1f1f;font:600 15px/1.15 var(--f-head);border-bottom:2px solid var(--frameline)}
.evc a.img{text-decoration:none}.evc a.img:hover{text-decoration:underline}
.evc .b{padding:10px;display:flex;flex-direction:column;gap:7px;flex:1}
.timer{font:600 56px var(--f-head);font-variant-numeric:tabular-nums}
.move-info{margin-left:auto;position:relative;flex:0 0 24px}
.move-info[open]{flex-basis:100%;margin-left:0}
.move-info summary{list-style:none;cursor:pointer}
.move-info summary::-webkit-details-marker{display:none}
.info-dot{width:24px;height:24px;border:1.5px solid currentColor;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-head)}
.move-help{padding:9px 10px;background:var(--card-solid);border:1.5px solid var(--frameline);border-radius:8px;font-size:12px}
.muscle-map{width:100%;height:auto;max-height:300px}
.muscle-shape{stroke:var(--frameline);stroke-width:1.5}
.muscle-trained{fill:#e58a58;background-color:#e58a58}.muscle-attention{fill:#8da2ee;background-color:#8da2ee}.muscle-neutral{fill:#d7d2c8;background-color:#d7d2c8}
.muscle-legend{display:flex;gap:12px;flex-wrap:wrap}
.move-draft{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px}
.move-draft>*{grid-column:span 3}
.move-draft .wide{grid-column:span 6}
.move-draft .full{grid-column:span 12}
.exercise-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:7px;max-height:210px;overflow:auto}
.exercise-result{justify-content:flex-start;text-align:left}
.hevy-import{border-top:1px solid var(--line);padding-top:10px}
.hevy-import>summary{cursor:pointer;font-weight:600}
.hevy-preview{display:block;max-width:220px;max-height:220px;object-fit:contain;border:1px solid var(--line);border-radius:8px}
.hevy-text{width:100%;margin-top:8px}
.draft-edit{flex:0 0 100%;margin-left:26px}
.draft-edit>summary{cursor:pointer;color:var(--accent);font-size:12px}
.draft-edit textarea{margin-top:6px}
.mini-body{max-width:640px;margin:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#282828;color:#f4efe2;padding:8px 16px;border-radius:8px;z-index:50}
.banner{background:var(--pk);color:#1f1f1f;border:2px solid #282828;border-radius:10px;padding:8px 14px;font-weight:500}
.banner .btn{background:#282828;border-color:#282828;color:#f4efe2}
@media(max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);margin:0 -4px;padding:8px 8px 84px;border-width:0;border-radius:0;background:none}
  body{background:var(--frame)}
  .side{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));top:auto;z-index:20;flex-direction:row;overflow-x:auto;border-radius:12px;padding:5px 8px}
  .brand{display:none}.nav{flex-direction:column;gap:1px;font-size:10px;padding:5px 10px;flex:none}
  .c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}
  .cell{min-height:56px}.cell .ev{font-size:0;padding:0;height:6px}
  .move-draft>*{grid-column:span 6}.move-draft .full{grid-column:span 12}
}
@media(max-width:520px){.strip{grid-template-columns:1fr 1fr}.strip .strip-weather{grid-column:1/-1;text-align:center}}
@media(prefers-reduced-motion:no-preference){.btn,.nav,.tab{transition:background .12s}}
.bstack{background:var(--pk);color:#1f1f1f;border:2px solid #282828;border-radius:10px;overflow:hidden}
.brow{padding:5px 12px;font-size:13px;font-weight:500}
.brow+.brow{border-top:1px solid rgba(31,31,31,.25)}
.bstack .btn{background:#282828;border-color:#282828;color:#f4efe2;padding:1px 8px;font-size:12px;margin-left:6px}
#banners:empty,#nnslot:empty{display:none}
#footer{display:flex;align-items:center;justify-content:flex-end;gap:8px}
#footer:empty{display:none}
.nnbar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 24px;background:var(--side);color:var(--on-side);box-shadow:none;padding:10px 16px;font-size:14px}
.nnbar .mono{opacity:.65;margin-right:8px}
.note{flex-direction:column;align-items:stretch;gap:6px;padding:10px}
.note input[type=text]{font-weight:600}
input[type=file]{max-width:100%;font-size:12px}
details summary{list-style-position:inside}

/* ================================================================
   LIFE — FIVE COMPLETE VISUAL IDENTITIES
   The theme switch changes the visual system only. Data and business
   logic are shared across all five designs.
   ================================================================ */
:root[data-theme="studio"]{
  color-scheme:light;
  --bg:#e9e3d2;--frame:#f9f6ef;--card:#fffdf7;--card-solid:#fffdf7;--line:rgba(40,40,40,.16);
  --fg:#282828;--mut:#6b665a;--accent:#193497;--accent-soft:rgba(25,52,151,.10);
  --side:#282828;--on-side:#f4efe2;--frameline:#282828;--shadow:#282828;
  --y:#f4c542;--pk:#eda398;--gn:#a8b86b;--bl:#b7c6ee;
  --good:#2f7d4f;--warn:#a85f00;--crit:#c62a3a;
  --f-body:'IBM Plex Sans',system-ui,sans-serif;--f-head:'IBM Plex Mono',ui-monospace,monospace;
}
:root[data-theme="midnight"]{
  color-scheme:dark;
  --bg:#080d16;--frame:#0c1421;--card:#152231;--card-solid:#1c2c3d;--line:rgba(161,200,222,.14);
  --fg:#eaf3fb;--mut:#9bacbc;--accent:#69dfc0;--accent-soft:rgba(105,223,192,.12);
  --side:#0b1521;--on-side:#eaf3fb;--frameline:#314459;--shadow:rgba(0,0,0,.13);
  --y:#e5b45d;--pk:#cf8fa6;--gn:#7ebc9d;--bl:#829fd3;
  --good:#72d8a1;--warn:#edbd70;--crit:#ff8997;
  --f-body:'Inter','IBM Plex Sans',system-ui,sans-serif;--f-head:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
}
:root[data-theme="paper"]{
  color-scheme:light;
  --bg:#e8e0d2;--frame:#f8f5ee;--card:#fffdf8;--card-solid:#f3eee4;--line:#dfd7ca;
  --fg:#322f2c;--mut:#85786f;--accent:#ab614c;--accent-soft:rgba(171,97,76,.11);
  --side:#f0e8dc;--on-side:#473e36;--frameline:#d9cec0;--shadow:rgba(61,42,29,.06);
  --y:#efe0b8;--pk:#eacbbc;--gn:#dbe2c9;--bl:#d7e2e3;
  --good:#527958;--warn:#ae6a3b;--crit:#b14a46;
  --f-body:'IBM Plex Sans',system-ui,sans-serif;--f-head:'Iowan Old Style','Palatino Linotype',Georgia,serif;
}
:root[data-theme="signal"]{
  color-scheme:light;
  --bg:#e9eff4;--frame:#f6f9fc;--card:#ffffff;--card-solid:#f4f7fa;--line:#d3dfe8;
  --fg:#0c2035;--mut:#617286;--accent:#155eff;--accent-soft:rgba(21,94,255,.10);
  --side:#1550e1;--on-side:#ffffff;--frameline:#cad7e3;--shadow:rgba(15,42,82,.04);
  --y:#dafb5a;--pk:#bad2ff;--gn:#d6f5e5;--bl:#d7edff;
  --good:#087f56;--warn:#aa6b00;--crit:#d2344b;
  --f-body:'Inter','IBM Plex Sans',system-ui,sans-serif;--f-head:'Inter','IBM Plex Sans',system-ui,sans-serif;
}
:root[data-theme="grove"]{
  color-scheme:light;
  --bg:#e3e9df;--frame:#eff3e9;--card:#fcfdf8;--card-solid:#e9eee5;--line:#d2dfd0;
  --fg:#293e30;--mut:#6a806e;--accent:#41694f;--accent-soft:rgba(65,105,79,.11);
  --side:#2d4939;--on-side:#f4f6e9;--frameline:#cbd8c8;--shadow:rgba(26,51,31,.055);
  --y:#e5e2aa;--pk:#e7cfc2;--gn:#c7ddc1;--bl:#d8e8df;
  --good:#307447;--warn:#996f22;--crit:#b2504b;
  --f-body:'IBM Plex Sans',system-ui,sans-serif;--f-head:'IBM Plex Sans',system-ui,sans-serif;
}
/* Midnight — sleek, low-light command deck with illuminated focus */
[data-theme="midnight"] body{background:radial-gradient(ellipse at 90% -10%,#183046 0%,#080d16 56%);font-size:14px}
[data-theme="midnight"] .app{max-width:1500px;grid-template-columns:205px minmax(0,1fr);gap:18px;margin:18px auto;padding:14px;border:1px solid #203446;border-radius:22px;box-shadow:0 20px 70px rgba(0,0,0,.25)}
[data-theme="midnight"] .side{border:1px solid #213649;border-radius:17px;padding:18px 12px;gap:5px}
[data-theme="midnight"] .brand{font-size:23px;padding-bottom:21px;letter-spacing:-.06em;color:#bafce7}
[data-theme="midnight"] .nav{padding:11px 12px;border-radius:11px}
[data-theme="midnight"] .nav[aria-current=page]{background:#243e45;color:#afffe1}
[data-theme="midnight"] .strip{background:#112235;border:1px solid #22384e;border-radius:14px;padding:12px 17px}
[data-theme="midnight"] .card{border:1px solid var(--frameline);border-radius:16px;box-shadow:0 10px 24px rgba(0,0,0,.11);padding:18px;gap:10px}
[data-theme="midnight"] .card.y,[data-theme="midnight"] .card.pk,[data-theme="midnight"] .card.gn,[data-theme="midnight"] .card.bl{--fg:#eaf3fb;--mut:#aab9c6;--card-solid:#253649;--line:#33485d;--accent:#69dfc0;--good:#72d8a1;--warn:#edbd70;--crit:#ff8997;color:var(--fg)}
[data-theme="midnight"] .card.y{background:linear-gradient(120deg,#313327 0%,#202b30 43%,#152231 100%);border-color:#6e673b}
[data-theme="midnight"] .card.pk{background:linear-gradient(155deg,#422d43,#182735 75%)}
[data-theme="midnight"] .card.gn{background:linear-gradient(155deg,#1b443a,#152231 75%)}
[data-theme="midnight"] .card.bl{background:linear-gradient(155deg,#233d62,#152231 75%)}
[data-theme="midnight"] .card.y .item,[data-theme="midnight"] .card.pk .item,[data-theme="midnight"] .card.gn .item,[data-theme="midnight"] .card.bl .item{background:rgba(255,255,255,.055)}
[data-theme="midnight"] .item{border:1px solid rgba(177,204,224,.035);padding:9px 10px;border-radius:10px}
[data-theme="midnight"] .btn,[data-theme="midnight"] input,[data-theme="midnight"] select,[data-theme="midnight"] textarea{border-radius:9px}
[data-theme="midnight"] .btn.pri{color:#082b25}
[data-theme="midnight"] .tab[aria-pressed=true],[data-theme="midnight"] .chk[aria-checked=true]{background:var(--accent);color:#092922;border-color:var(--accent)}
[data-theme="midnight"] .nnbar{background:#112235;color:#eaf3fb;box-shadow:none}
[data-theme="midnight"] .banner,[data-theme="midnight"] .bstack{background:#493c35;color:#fff2d9;border-color:#685644}
[data-theme="midnight"] .banner .btn,[data-theme="midnight"] .bstack .btn{background:#162b36;border-color:#45616c;color:#e9f7ee}
[data-theme="midnight"] .cell.today{background:#234b43;color:#d2fff0;border-color:#69dfc0}
[data-theme="midnight"] h3{letter-spacing:.12em}
/* Paper — calm editorial journal with serif hierarchy */
[data-theme="paper"] body{background:#e8e0d2;font-size:14.5px;line-height:1.55}

<script>
/* ---------- Courses & Deadlines ---------- */
/* Dutch and English dates: "12 december 23:59", "vrijdag 17u", "morgen", "tomorrow 14.30" */
const MON={jan:0,feb:1,mrt:2,maa:2,mar:2,apr:3,mei:4,may:4,jun:5,jul:6,aug:7,sep:8,okt:9,oct:9,nov:10,dec:11};
const WDAY={zondag:0,sunday:0,maandag:1,monday:1,dinsdag:2,tuesday:2,woensdag:3,wednesday:3,donderdag:4,thursday:4,vrijdag:5,friday:5,zaterdag:6,saturday:6};
const esc2=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function parseWhen(s,defH=23,defM=59){
  const l=s.toLowerCase(),used=[];let day=null;
  let m=l.match(/\b(\d{1,2})(?:st|nd|rd|th|e)?\s*(januari|january|jan|februari|february|feb|maart|march|mrt|mar|april|apr|mei|may|juni|june|jun|juli|july|jul|augustus|august|aug|september|sept|sep|oktober|october|okt|oct|november|nov|december|dec)\b(?:\s+(20\d\d)\b)?/);
  let hasYear=false;
  if(m){day=new Date(m[3]?+m[3]:NOW().getFullYear(),MON[m[2].slice(0,3)],+m[1]);hasYear=!!m[3];used.push(m[0])}
  if(!day){m=l.match(/\b(overmorgen|vandaag|today|morgen|tomorrow)\b/);
    if(m){day=sod(NOW());if(m[1]==='morgen'||m[1]==='tomorrow')day=addDays(day,1);if(m[1]==='overmorgen')day=addDays(day,2);used.push(m[0])}}
  if(!day){m=l.match(/\b(zondag|sunday|maandag|monday|dinsdag|tuesday|woensdag|wednesday|donderdag|thursday|vrijdag|friday|zaterdag|saturday)\b/);
    if(m){const diff=((WDAY[m[1]]-NOW().getDay()+7)%7)||7;day=addDays(sod(NOW()),diff);used.push(m[0])}}
  if(!day||isNaN(day))return null;
  let H=defH,M=defM,t=l.match(/(?:\b(?:om|at)\s+)?\b(\d{1,2})[:.u](\d{2})\b/);
  if(t&&+t[1]<24&&+t[2]<60){H=+t[1];M=+t[2];used.push(t[0])}
  else{t=l.match(/(?:\b(?:om|at)\s+)?\b(\d{1,2})\s*(?:u|uur|h)\b/);
    if(t&&+t[1]<24){H=+t[1];M=0;used.push(t[0])}
    else{t=l.match(/\b(\d{1,2})\s*(am|pm)\b/);if(t){H=(+t[1]%12)+(t[2]==='pm'?12:0);M=0;used.push(t[0])}}}
  day.setHours(H,M,0,0);
  if(!hasYear&&day<NOW()&&m&&/\d/.test(m[0]))day.setFullYear(day.getFullYear()+1);
  return{date:day,used}}
function parseQuick(s,courseId=''){
  const w=parseWhen(s);if(!w)return null;
  const lower=s.toLowerCase(),c=S.courses.find(c=>c.id===courseId)||S.courses.find(c=>lower.includes(c.name.toLowerCase())||(c.code&&lower.includes(c.code.toLowerCase())));
  let t=s;w.used.forEach(u=>{t=t.replace(new RegExp(esc2(u),'i'),' ')});
  if(c)t=t.replace(new RegExp(esc2(c.name),'i'),' ').replace(new RegExp(esc2(c.code||'@@@'),'i'),' ');
  t=t.replace(/\b(due|deadline|for|voor|before|uiterlijk|op|om|at|by|inleveren)\b/gi,' ').replace(/[,;:]+/g,' ').replace(/\s+/g,' ').trim()||'Deadline';
  const type=/exam|tentamen|toets/i.test(s)?'exam':/present/i.test(s)?'presentation':/paper|essay|verslag|scriptie/i.test(s)?'paper':'assignment';
  return{id:uid(),title:t[0].toUpperCase()+t.slice(1),course:c?c.id:'',type,due:w.date.toISOString(),weight:0,hours:4,status:'not started'}}
function crunch(){
  const w={};upcoming().forEach(d=>{const k=iso(mondayOf(d.due));(w[k]=w[k]||{n:0,h:0}).n++;w[k].h+=d.hours||0});
  return Object.entries(w).filter(([k,v])=>v.n>=3||v.h>=25).map(([k,v])=>({week:k,...v}))}
function freeSlots(dl){
  const out=[],need=Math.ceil((dl.hours||0)/2),end=new Date(dl.due);let d=sod(NOW());
  while(d<end&&out.length<need){
    const gymT=S.gym.days[d.getDay()];
    for(const h of [9,13,15]){
      if(out.length>=need)break;const s=new Date(d);s.setHours(h);const e=new Date(d);e.setHours(h+2);
      if(s<NOW()||e>end)continue;
      const clash=S.events.some(x=>new Date(x.s)<e&&new Date(x.e)>s);
      if(!clash)out.push({s:s.toISOString(),e:e.toISOString(),t:'Study: '+dl.title})}
    d=addDays(d,1)}
  return out}
function vCourses(){
  const up=upcoming(),cr=crunch();
  const horizon=addDays(sod(NOW()),56);
  return`<div class="grid">
  ${cr.map(c=>`<div class="banner" style="grid-column:span 12"><b>Crunch week</b> from ${fmtD(c.week)}: ${c.n} deadlines and about ${c.h} hours of work. Start the biggest one earlier.</div>`).join('')}
  <div class="card bl c12"><h3>Quick add</h3><div class="row wrap"><input id="qa" type="text" class="sp" placeholder="paper for Research Methods due 12 December 23:59" aria-label="Quick add deadline"><select id="qaCourse" aria-label="Course for deadline"><option value="">Choose course</option>${S.courses.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}${c.code?' · '+esc(c.code):''}</option>`).join('')}</select><button class="btn ico" id="qaMic" aria-label="Dictate">${ico('mic')}</button><button class="btn pri" id="qaAdd">Add deadline</button></div>
   <div class="mut">Choose a course or include its name in the text. Dutch or English works: "paper voor Research Methods uiterlijk vrijdag 23u59". Import your university calendar as a file in the Calendar tab. Email to deadline is in the Email tab.</div></div>
  <div class="card c8"><h3>Deadline radar</h3>${up.map(d=>{const L=left(d.due),sl=freeSlots(d);return`<div class="item deadline-item"><span class="dot" style="background:${course(d.course).color}"></span><span class="t"><b>${esc(d.title)}</b><div class="mut">${esc(course(d.course).name)} · ${d.type} · ${fmtD(d.due)} ${fmtT(d.due)}${d.weight?` · ${d.weight}% of grade`:''} · ~${d.hours}h</div></span><div class="deadline-controls"><span class="pill ${L.c}">${L.t}</span>
   <select data-st="${d.id}" aria-label="Status">${['not started','in progress','submitted','graded'].map(s=>`<option ${s===d.status?'selected':''}>${s}</option>`).join('')}</select>
   ${sl.length?`<button class="btn sm" data-plan="${d.id}">Plan ${sl.length} study blocks</button>`:''}<button class="btn sm ico" data-dd="${d.id}" aria-label="Delete deadline">${ico('x',14)}</button></div></div>`}).join('')||'<div class="mut">No open deadlines.</div>'}</div>
  <div class="card y c4"><h3>Courses</h3>${S.courses.map(c=>`<div class="item"><span class="dot" style="background:${c.color}"></span><span class="t"><b>${esc(c.name)}</b><div class="mut">${c.code} · ${c.ects} ECTS</div></span><button class="btn sm ico" data-dc="${c.id}" aria-label="Delete ${esc(c.name)}">${ico('x',14)}</button></div>`).join('')||'<div class="mut">No courses yet.</div>'}
   <div class="row wrap"><input id="ncN" type="text" class="sp" placeholder="Course name" aria-label="New course name"><input id="ncC" type="text" placeholder="Code" style="width:72px" aria-label="Course code"><input id="ncE" type="number" min="1" value="5" style="width:60px" aria-label="ECTS"><button class="btn pri" id="ncAdd">Add</button></div>
  </div>
  </div>`}
function bindCourses(){
  bindCourseTools();
  $('#qaMic').onclick=e=>dictate(t=>{$('#qa').value=t},e.currentTarget);
  $('#qaAdd').onclick=()=>{const r=parseQuick($('#qa').value,$('#qaCourse').value);if(!r)return toast('Include a date, like "12 december 23:59" or "vrijdag"');if(S.courses.length&&!r.course)return toast('Choose a course or include its name in the text');S.deadlines.push(r);save();render();toast('Deadline added')};
  document.querySelectorAll('[data-st]').forEach(s=>s.onchange=()=>{S.deadlines.find(d=>d.id===s.dataset.st).status=s.value;save();render()});
  document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{const d=S.deadlines.find(x=>x.id===b.dataset.plan);freeSlots(d).forEach(s=>S.events.push({id:uid(),t:s.t,cat:'study',s:s.s,e:s.e}));save();render();toast('Study blocks added to your calendar')})}

let todoTab='daily';

async function readHevyScreenshot(file){

 let worker;

  const engine=await loadTesseract();

   const label=$('#hevyStatus');
   if(label&&m.status)label.textContent=m.progress===undefined?m.status:`${m.status} ${Math.round(m.progress*100)}%`
  }});
  const result=await worker.recognize(file);
  hevyText=(result.data.text||'').trim();
  hevyStatus=hevyText?'Text recognized. Review it, then add matching exercise names.':'No text was found. Try a sharper screenshot or use exercise search.';
  if(!hevyText)toast('No text was found in the screenshot')
 }catch(error){
  hevyStatus=`OCR failed: ${error instanceof Error?error.message:String(error)}`;
  toast(hevyStatus)
 }finally{
  if(worker){

  }

}

const guessCat=t=>/gym|workout|training|fitness|sport/i.test(t)?'gym':/lecture|college|hoorcollege|werkgroep|tentamen|exam|study|studie|project|thesis|scriptie|seminar|tutorial|deadline/i.test(t)?'study':/guitar|gitaar|jam|band practice/i.test(t)?'guitar':/dinner|diner|party|borrel|concert|festival|birthday|verjaardag|drinks|friends/i.test(t)?'social':'personal';
function icsDate(v,params){
  v=v.trim();let m=v.match(/^(\d{4})(\d\d)(\d\d)$/);
  if(m)return{d:new Date(+m[1],+m[2]-1,+m[3]),allDay:true};
  m=v.match(/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)?(Z)?$/);if(!m)return null;
  const a=[+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)];
  return{d:m[7]?new Date(Date.UTC(...a)):new Date(...a),allDay:false}}
function parseICS(text){
  const lines=text.replace(/\r/g,'').replace(/\n[ \t]/g,'').split('\n'),evs=[];let cur=null;
  for(const ln of lines){
    if(ln==='BEGIN:VEVENT'){cur={};continue}
    if(ln==='END:VEVENT'){if(cur&&cur.s)evs.push(cur);cur=null;continue}
    if(!cur)continue;const i=ln.indexOf(':');if(i<0)continue;
    const head=ln.slice(0,i),val=ln.slice(i+1),name=head.split(';')[0].toUpperCase(),params=head.slice(name.length);
    if(name==='SUMMARY')cur.t=val.replace(/\\,/g,',').replace(/\\n/gi,' ').replace(/\\;/g,';').replace(/\\\\/g,'\\');
    else if(name==='DTSTART'){const r=icsDate(val,params);if(r){cur.s=r.d;cur.allDay=r.allDay}}
    else if(name==='DTEND'){const r=icsDate(val,params);if(r)cur.e=r.d}
    else if(name==='RRULE')cur.rr=val;
    else if(name==='STATUS'&&/CANCELLED/i.test(val))cur.x=1;
    else if(name==='EXDATE')(cur.ex=cur.ex||[]).push(...val.split(',').map(v=>{const r=icsDate(v,params);return r&&r.d.getTime()}));
  }
  const lo=addDays(sod(NOW()),-14).getTime(),hi=addDays(sod(NOW()),240).getTime(),out=[];
  const wdm={SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};
  for(const e of evs){
    if(e.x)continue;const dur=e.e?e.e-e.s:(e.allDay?DAY:36e5);
    const push=s=>{const t=s.getTime();if(t<lo||t>hi||(e.ex&&e.ex.includes(t)))return;out.push({id:uid(),t:e.t||'Event',cat:guessCat(e.t||''),s:s.toISOString(),e:new Date(t+dur).toISOString(),src:'ics',allDay:!!e.allDay})};
    if(!e.rr){push(e.s);continue}
    const r=Object.fromEntries(e.rr.split(';').map(x=>x.split('='))),step=+(r.INTERVAL||1),count=r.COUNT?+r.COUNT:Infinity,until=r.UNTIL?(icsDate(r.UNTIL,'')||{}).d:null;
    let n=0;
    if(r.FREQ==='DAILY'){let c=new Date(e.s);for(let i=0;i<2000&&n<count;i++){if(until&&c>until||c.getTime()>hi)break;push(c);n++;c=addDays(c,step)}}
    else if(r.FREQ==='WEEKLY'){
      const days=(r.BYDAY?r.BYDAY.split(',').map(x=>wdm[x.slice(-2)]):[e.s.getDay()]).sort((a,b)=>((a+6)%7)-((b+6)%7));
      const wk0=addDays(new Date(e.s),-((e.s.getDay()+6)%7));
      outer:for(let w=0;w<500;w++){const base=addDays(wk0,w*7*step);if(base.getTime()>hi)break;
        for(const d of days){const c=addDays(base,(d+6)%7);c.setHours(e.s.getHours(),e.s.getMinutes(),0,0);if(c<e.s)continue;if(until&&c>until||n>=count)break outer;push(c);n++}}}
    else if(r.FREQ==='MONTHLY'||r.FREQ==='YEARLY'){for(let i=0;i<120&&n<count;i++){const c=new Date(e.s);if(r.FREQ==='MONTHLY')c.setMonth(c.getMonth()+i*step);else c.setFullYear(c.getFullYear()+i*step);if(until&&c>until||c.getTime()>hi)break;push(c);n++}}
    else push(e.s)}
  return out}
function importICS(file){
  const rd=new FileReader();
  rd.onerror=()=>toast('Could not read that file');
  rd.onload=()=>{let list=[];try{list=parseICS(String(rd.result))}catch(e){}
    if(!list.length){toast('No upcoming events found in that file');return}
    const before=S.events.slice();
    const keep=S.events.filter(e=>e.src!=='ics'&&!/^e[1-8]$/.test(e.id));
    S.events.splice(0,S.events.length,...keep,...list);save();render();
    toastUndo(list.length+' events imported',()=>{S.events.splice(0,S.events.length,...before)})};
  rd.readAsText(file)}

function vCal(){return`<div style="display:flex;flex-direction:column;gap:12px">${vCalGrid()}${calTools()}</div>`}

/* ---- Data tab: backup, restore, sample data, alerts ---- */
let pendingImport=null;
function vData(){
  const n=k=>(S[k]||[]).length,perm=('Notification' in window)?Notification.permission:'unsupported';
  return`<div class="grid">
  <div class="card c6"><h3>Backup</h3><div class="mut">Everything you enter is stored in this browser only. Another browser or device starts empty. Export a backup to keep a copy or to move it.</div>
   <div class="row wrap"><button class="btn pri" id="dExport">Export backup (JSON)</button></div>
   <label class="mut" for="dImport">Restore from a backup file</label><input id="dImport" type="file" accept=".json,application/json">
   <div id="dMsg" class="mut"></div>
   <div class="mut">Stored now: ${n('courses')} courses, ${n('deadlines')} deadlines, ${n('projects')} projects, ${n('events')} events, ${n('todos')} to-dos, ${n('notes')} notes, ${n('check')} to-check items, ${S.gym.logs.length} workouts.${storageOk?'':' <b>Browser storage is blocked, so nothing here will survive a reload.</b>'}</div></div>
  <div class="card c6"><h3>Sample data</h3>${S.sample?`<div class="mut">The courses, deadlines, projects, calendar and email you see are made-up examples. Clearing removes only those examples. Anything you added yourself stays, and you can undo.</div><button class="btn" id="dClear">Clear sample data</button>`:'<div class="mut">No sample data left. Calendar events come from what you add or import. Email and live event listings are not connected yet.</div>'}</div>
  <div class="card c6"><h3>Alerts</h3><div class="mut">In-page reminders: gym in the next hour and one dismissible deadline reminder within 24 hours. Deadline reminders stop after the deadline; all deadlines remain in Courses and Calendar. System alerts only appear while this page is open, and some viewers block them.</div>
   <div class="row wrap"><span class="pill ${perm==='granted'?'good':perm==='denied'?'crit':''}">System alerts: ${perm}</span></div></div>
  </div>`}
function bindData(){
  $('#dExport').onclick=async()=>{
    const json=JSON.stringify(S,null,2),name='life-dashboard-backup-'+iso(NOW())+'.json';let dl=null;
    try{dl=await window.claude?.use?.('downloads')}catch(e){}
    if(dl){try{await dl.save({filename:name,data:json});toast('Backup ready');return}catch(e){if(e&&e.code==='declined')return}}
    $('#dMsg').innerHTML='Saving files is not available here. Copy this text into a file ending in .json:<textarea readonly rows="6" id="dText"></textarea>';$('#dText').value=json;$('#dText').select()};
  $('#dImport').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{let o=null;try{o=JSON.parse(String(rd.result))}catch(e){}
      if(!o||typeof o!=='object'||!Array.isArray(o.courses)||!o.gym){$('#dMsg').textContent='That file is not a backup from this dashboard.';pendingImport=null;return}
      pendingImport=o;const c=k=>Array.isArray(o[k])?o[k].length:0;
      $('#dMsg').innerHTML=`Backup contains ${c('courses')} courses, ${c('deadlines')} deadlines, ${c('notes')} notes, ${c('events')} events. <button class="btn sm" id="dGo">Replace my data with this</button>`;
      $('#dGo').onclick=()=>{try{localStorage.setItem('lifedash.backup.before-import',JSON.stringify(S))}catch(e){}
        Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,pendingImport);normalizeState();save();setTheme();render();toast('Backup restored')}};
    rd.readAsText(f)};
  const cl=$('#dClear');if(cl)cl.onclick=clearSample;
}

/* ---- in-app banners: storage, sample data, gym, and one urgent deadline ---- */
function reminders(){
  const out=[];
  if(!storageOk)out.push({html:'<b>Browser storage is blocked.</b> Changes will be lost when you close this page. Export a backup in Data.'});
  if(S.sample)out.push({html:'You are looking at <b>sample data</b>. <button class="btn sm" id="rClear">Clear sample data</button> <button class="btn sm" id="rCal">Import your calendar</button>'});
  const g=gymToday();
  if(g&&!(S.gym.snooze>Date.now())){const[h,m]=g.split(':'),t=new Date();t.setHours(+h,+m,0,0);const min=Math.round((t-NOW())/6e4);
    if(min>0&&min<=60)out.push({html:`Gym in ${min} minutes (${g}). <button class="btn sm" id="snz">Snooze 15 min</button> <button class="btn sm" id="skp">Skip today</button>`,key:iso(NOW())+':gym'})}
  for(const d of upcoming()){const ms=new Date(d.due)-NOW();if(!Number.isFinite(ms)||ms<=0||ms>DAY)continue;
    const key=d.id+':1d';if(S.reminded[key]==='x')continue;
    const when=`in ${Math.max(1,Math.round(ms/36e5))} hours (${fmtT(d.due)})`;
    out.push({html:`<b>${esc(d.title)}</b> is due ${when}. <button class="btn sm" data-sub="${d.id}">Mark submitted</button> <button class="btn sm" data-dis="${key}">Dismiss</button>`,key});break}
  $('#banners').innerHTML=out.length?`<div class="bstack">${out.map(x=>`<div class="brow">${x.html}</div>`).join('')}</div>`:'';
  const on=(sel,fn)=>document.querySelectorAll(sel).forEach(fn);
  const rc=$('#rClear');if(rc)rc.onclick=clearSample;const rl=$('#rCal');if(rl)rl.onclick=()=>{S.tab='cal';save();render()};
  const a=$('#snz');if(a)a.onclick=()=>{S.gym.snooze=Date.now()+15*6e4;save();reminders()};
  const b=$('#skp');if(b)b.onclick=()=>{S.gym.skipped[iso(NOW())]=1;save();reminders()};
  on('[data-sub]',x=>x.onclick=()=>{const d=S.deadlines.find(q=>q.id===x.dataset.sub);if(d){d.status='submitted';save();render();reminders()}});
  on('[data-dis]',x=>x.onclick=()=>{S.reminded[x.dataset.dis]='x';save();reminders()});
  if('Notification' in window&&Notification.permission==='granted'){
    out.filter(x=>x.key&&!S.reminded[x.key+':n']).slice(0,1).forEach(x=>{S.reminded[x.key+':n']=1;save();try{new Notification('Life dashboard',{body:x.html.replace(/<[^>]+>/g,'').replace(/(Mark submitted|Dismiss|Snooze 15 min|Skip today)/g,'').trim()})}catch(e){}})}}

/* ================= added: Now / Next, Notes, To check, quick capture ================= */
function nowNext(){
  const now=NOW(),items=[];
  S.events.filter(e=>!e.allDay).forEach(e=>items.push({s:new Date(e.s),e:new Date(e.e||(+new Date(e.s)+36e5)),t:e.t,k:e.cat}));
  for(let i=0;i<8;i++){const d=addDays(sod(now),i),t=S.gym.days[d.getDay()];
    if(!t||S.gym.skipped[iso(d)]||S.events.some(e=>e.cat==='gym'&&iso(e.s)===iso(d))||S.gym.logs.some(l=>iso(l.date)===iso(d)))continue;
    const[h,m]=t.split(':'),s=new Date(d);s.setHours(+h,+m,0,0);items.push({s,e:new Date(+s+75*6e4),t:'Gym · '+workoutName(),k:'gym'})}
  upcoming().forEach(d=>{const s=new Date(d.due);items.push({s,e:s,t:'Due: '+d.title,k:'deadline'})});
  const cur=items.filter(x=>x.s<=now&&x.e>now&&x.k!=='deadline').sort((a,b)=>a.s-b.s)[0];
  const nxt=items.filter(x=>x.s>now).sort((a,b)=>a.s-b.s)[0];
  return{cur,nxt}}
function fmtWhen(d){const t=sod(d).getTime(),n=sod(NOW()).getTime(),hm=fmtT(d);return t===n?'today '+hm:t===n+DAY?'tomorrow '+hm:fmtD(d,{weekday:'short',day:'numeric',month:'short'})+' '+hm}
function inText(ms){const m=Math.round(ms/6e4);if(m<60)return'in '+Math.max(1,m)+' min';const h=Math.floor(m/60);if(h<24)return'in '+h+'h '+String(m%60).padStart(2,'0')+'m';const d=Math.round(m/1440);return'in '+d+(d===1?' day':' days')}
function nowNextHtml(){
  const{cur,nxt}=nowNext();
  const a=cur?`<span><span class="mono">NOW</span><b>${esc(cur.t)}</b> <span style="opacity:.75">until ${fmtT(cur.e)}</span></span>`:'';
  const b=nxt?`<span><span class="mono">NEXT</span><b>${esc(nxt.t)}</b> <span style="opacity:.75">${fmtWhen(nxt.s)} · ${inText(nxt.s-NOW())}</span></span>`:'<span><span class="mono">NEXT</span>Nothing coming up. Add an event, a deadline or a gym day.</span>';
  return a+b}
setInterval(()=>{const el=$('#nownext');if(el)el.innerHTML=nowNextHtml()},30000);

/* ---- quick capture on Today ---- */
let capMode='todo',capDraft='';
const CTYPES=['book','film','series','album','place','article','other'];

/* ---- Notes tab ---- */
let noteQ='',chkQ='',chkType='all',chkOpen=null;
const linkOptions=sel=>`<option value="">No link</option>${S.projects.map(p=>`<option value="p:${p.id}" ${sel==='p:'+p.id?'selected':''}>Project: ${esc(p.name)}</option>`).join('')}${S.courses.map(c=>`<option value="c:${c.id}" ${sel==='c:'+c.id?'selected':''}>Course: ${esc(c.name)}</option>`).join('')}`;
function notesList(){
  const q=noteQ.trim().toLowerCase();
  const L=S.notes.filter(n=>!q||((n.title||'')+' '+(n.text||'')).toLowerCase().includes(q)).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(b.upd||0)-(a.upd||0));
  if(!L.length)return S.notes.length?'<div class="mut">No note matches that search.</div>':'<div class="mut">No notes yet. Use New note, or the capture box on Today.</div>';
  return L.map(n=>`<div class="item note"><div class="row"><input type="text" class="sp" data-nt="${n.id}" value="${esc(n.title||'')}" placeholder="Title (optional)" aria-label="Note title">
   <button class="btn sm" data-nact="pin" data-id="${n.id}" aria-pressed="${!!n.pin}">${n.pin?'Pinned':'Pin'}</button><button class="btn sm ico" data-nact="del" data-id="${n.id}" aria-label="Delete note">${ico('x',14)}</button></div>
   <textarea data-nx="${n.id}" rows="4" aria-label="Note text" placeholder="Write here">${esc(n.text||'')}</textarea>
   <div class="row wrap"><span class="mut">${fmtD(n.upd||n.ts,{day:'numeric',month:'short'})} ${fmtT(n.upd||n.ts)}</span><span class="sp"></span><select data-nl="${n.id}" aria-label="Link note">${linkOptions(n.link||'')}</select></div></div>`).join('')}
function chkList(){
  const q=chkQ.trim().toLowerCase(),match=c=>!q||(c.title+' '+(c.why||'')+' '+(c.verdict||'')).toLowerCase().includes(q);
  const open=S.check.filter(c=>!c.done&&match(c)&&(chkType==='all'||c.type===chkType)),done=S.check.filter(c=>c.done&&match(c));
  const row=c=>{const form=chkOpen===c.id?`<div class="row wrap"><input type="text" id="cv-${c.id}" class="sp" placeholder="One-line verdict (optional)" aria-label="Verdict"><select id="cr-${c.id}" aria-label="Rating"><option value="">No rating</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${n} of 5</option>`).join('')}</select><button class="btn sm pri" data-nact="csave" data-id="${c.id}">Save</button><button class="btn sm" data-nact="ccancel" data-id="${c.id}">Cancel</button></div>`:'';
    return`<div class="item" style="flex-wrap:wrap"><span class="t"><b>${esc(c.title)}</b> <span class="pill">${c.type}</span>${c.why?`<div class="mut">${esc(c.why)}</div>`:''}${c.done&&(c.verdict||c.rating)?`<div class="mut">${c.rating?c.rating+'/5 · ':''}${esc(c.verdict||'')}</div>`:''}</span>
     ${c.done?`<button class="btn sm" data-nact="cundone" data-id="${c.id}">Back to list</button>`:`<button class="btn sm" data-nact="cdone" data-id="${c.id}">Done</button>`}<button class="btn sm ico" data-nact="cdel" data-id="${c.id}" aria-label="Delete ${esc(c.title)}">${ico('x',14)}</button>${form?`<div style="flex-basis:100%">${form}</div>`:''}</div>`};
  return(open.map(row).join('')||`<div class="mut">${S.check.some(c=>!c.done)?'Nothing matches.':'Nothing here yet. Add a book, a film, a place.'}</div>`)
   +(S.check.some(c=>c.done)?`<details style="margin-top:6px" ${q?'open':''}><summary class="mut" style="cursor:pointer">Done (${done.length})</summary><div style="display:flex;flex-direction:column;gap:6px;margin-top:6px">${done.map(row).join('')||'<div class="mut">No done item matches.</div>'}</div></details>`:'')}
function vNotes(){
  const types=CTYPES.filter(t=>S.check.some(c=>!c.done&&c.type===t));
  return`<div class="grid"><div class="card c7"><h3><span class="tag" style="background:var(--accent)"></span>Notes</h3>
   <div class="row wrap"><input id="nq" type="text" class="sp" placeholder="Search notes" aria-label="Search notes" value="${esc(noteQ)}"><button class="btn ico" data-nact="mic" aria-label="Dictate a new note">${ico('mic')}</button><button class="btn pri" data-nact="new">New note</button></div>
   <div class="mut">Saved as you type.</div><div id="nList" style="display:flex;flex-direction:column;gap:8px">${notesList()}</div></div>
  <div class="card c5"><h3><span class="tag" style="background:var(--pk)"></span>To check</h3>
   <div class="row wrap"><input id="cT" type="text" class="sp" placeholder="A book, a film, a place" aria-label="Title"><select id="cType" aria-label="Type">${CTYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
   <div class="row wrap"><input id="cW" type="text" class="sp" placeholder="Why, or who recommended it (optional)" aria-label="Why"><button class="btn ico" data-nact="cmic" aria-label="Dictate a title">${ico('mic')}</button><button class="btn pri" data-nact="cadd">Add</button></div>
   <div class="tabs"><button class="tab" data-nact="ctype" data-id="all" aria-pressed="${chkType==='all'}">All</button>${types.map(t=>`<button class="tab" data-nact="ctype" data-id="${t}" aria-pressed="${chkType===t}">${t}</button>`).join('')}</div>
   <input id="cq" type="text" placeholder="Search to-check and done" aria-label="Search to check" value="${esc(chkQ)}">
   <div id="cList" style="display:flex;flex-direction:column;gap:6px">${chkList()}</div></div></div>`}
function bindNotes(){}
let noteTimer;
function noteTouch(){clearTimeout(noteTimer);noteTimer=setTimeout(save,300)}
function newNote(text){const n={id:uid(),title:'',text:text||'',pin:false,ts:Date.now(),upd:Date.now()};S.notes.unshift(n);noteQ='';save();render();return n}
document.addEventListener('input',e=>{const t=e.target;if(!t||!t.matches)return;
  if(t.matches('[data-nt],[data-nx]')){const id=t.dataset.nt||t.dataset.nx,n=S.notes.find(x=>x.id===id);if(!n)return;if(t.dataset.nt!==undefined)n.title=t.value;else n.text=t.value;n.upd=Date.now();noteTouch()}
  else if(t.id==='nq'){noteQ=t.value;$('#nList').innerHTML=notesList()}
  else if(t.id==='cq'){chkQ=t.value;$('#cList').innerHTML=chkList()}});
document.addEventListener('change',e=>{const t=e.target;if(t&&t.matches&&t.matches('[data-nl]')){const n=S.notes.find(x=>x.id===t.dataset.nl);if(n){n.link=t.value||undefined;n.upd=Date.now();save()}}});
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-nact]');if(!b)return;const a=b.dataset.nact,id=b.dataset.id;
  const redo=()=>{const el=$('#cList');if(el)el.innerHTML=chkList()};
  if(a==='new'){const n=newNote();const ta=document.querySelector(`[data-nx="${n.id}"]`);if(ta)ta.focus()}
  else if(a==='mic'){const n=newNote();dictate(t=>{n.text=(n.text+' '+t).trim();n.upd=Date.now();save();const ta=document.querySelector(`[data-nx="${n.id}"]`);if(ta)ta.value=n.text},b)}
  else if(a==='pin'){const n=S.notes.find(x=>x.id===id);if(n){n.pin=!n.pin;save();$('#nList').innerHTML=notesList()}}
  else if(a==='del')delFrom(S.notes,id,'Note');
  else if(a==='cadd'){const t=$('#cT').value.trim();if(!t)return toast('Type a title first');S.check.unshift({id:uid(),title:t,type:$('#cType').value,why:$('#cW').value.trim(),done:false,ts:Date.now()});save();render()}
  else if(a==='cmic')dictate(t=>{$('#cT').value=(($('#cT').value+' '+t).trim())},b);
  else if(a==='ctype'){chkType=id;render()}
  else if(a==='cdone'){chkOpen=id;redo();const v=document.getElementById('cv-'+id);if(v)v.focus()}
  else if(a==='ccancel'){chkOpen=null;redo()}
  else if(a==='csave'){const c=S.check.find(x=>x.id===id);if(c){c.done=true;c.doneTs=Date.now();c.verdict=(document.getElementById('cv-'+id).value||'').trim();const r=+document.getElementById('cr-'+id).value;c.rating=r||undefined;chkOpen=null;save();render()}}
  else if(a==='cundone'){const c=S.check.find(x=>x.id===id);if(c){c.done=false;save();render()}}
  else if(a==='cdel')delFrom(S.check,id,'Item')});

const VIEWS={notes:[vNotes,bindNotes],data:[vData,bindData],home:[vHome,bindHome],goals:[vGoals,bindGoals],courses:[vCourses,bindCourses],todos:[vTodos,bindTodos],cal:[vCal,bindCal],mail:[vMail,bindMail],gym:[vGym,bindGym],body:[vBody,bindBody],events:[vEvents,bindEvents]};

  $('#footer').innerHTML=('Notification' in window&&Notification.permission==='default')?'<span class="mut">Optional system alerts</span><button class="btn sm" id="notifBtn">Turn on alerts</button>':'';
  const nbEl=$('#notifBtn');if(nbEl)nbEl.onclick=async()=>{await askNotify();render()}
}
setTheme();render();reminders();setInterval(reminders,30000);setInterval(()=>{const c=$('#topClock');if(c)c.textContent=fmtClock(NOW());const d=$('#topDate');if(d)d.textContent=fmtD(NOW(),{weekday:'long',day:'numeric',month:'long'})},1000);
